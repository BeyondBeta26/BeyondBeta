name: Update signals from Google Sheet

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch sheet and rebuild signals.json
        run: python3 scripts/update_signals.py

      - name: Commit signals.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if git diff --cached --quiet; then
            echo "No changes to signals.json"
          else
            git commit -m "Update signals.json from Google Sheet"
            git push
          fi
